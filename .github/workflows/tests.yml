name: Tests

on:
  push:
    branches:
      - "master"
      - "main"
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
        deps:
          - highest
          - lowest
        composer:
          - v2
    name: Run Unit Tests on PHP ${{ matrix.php }}, ${{ matrix.deps }} dependencies
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, bz2, gettext, mbstring, memcached, mysqli, opcache, pdo_mysql, zip, pdo, intl, json, pdo_pgsql, pgsql, session, simplexml, xml
          tools: composer:v2, pecl
          coverage: none

      - name: "Install ${{ matrix.deps }} dependencies with composer"
        uses: "ramsey/composer-install@v3"
        with:
          dependency-versions: "${{ matrix.deps }}"

      - name: Run PHPUnit tests
        run: |
          # PHPUnit notices (e.g. mocks without expectations) only exist since PHPUnit 12
          if php vendor/bin/phpunit --version | grep -qE "PHPUnit (1[2-9]|[2-9][0-9])\."; then
            php vendor/bin/phpunit --fail-on-phpunit-notice
          else
            php vendor/bin/phpunit
          fi
