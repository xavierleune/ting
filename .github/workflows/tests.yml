name: Tests

on:
  push:
    branches:
      - "master"
      - "main"
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
        deps:
          - highest
          - lowest
    services:
      postgres:
        image: postgres:16
        ports:
          - '5432'
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
    name: Run Unit Tests on PHP ${{ matrix.php }}, ${{ matrix.deps }} dependencies
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, bz2, gettext, mbstring, memcached, mysqli, opcache, pdo_mysql, zip, pdo, intl, json, pdo_pgsql, pgsql, session, simplexml, xml
          tools: composer:v2, pecl
          coverage: none

      - name: "Install ${{ matrix.deps }} dependencies with composer"
        uses: "ramsey/composer-install@v3"
        with:
          dependency-versions: "${{ matrix.deps }}"

      - name: Run PHPUnit tests
        run: |
          # PHPUnit notices (e.g. mocks without expectations) only exist since PHPUnit 12
          if php vendor/bin/phpunit --version | grep -qE "PHPUnit (1[2-9]|[2-9][0-9])\."; then
            php vendor/bin/phpunit --fail-on-phpunit-notice
          else
            php vendor/bin/phpunit
          fi

  static-code-analysis:
    name: "Static Code Analysis"

    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        # Tooling PHP version only: phpstan.neon.dist targets PHP 8.2 (phpVersion),
        # and tomasvotruba/type-coverage (type_perfect rules) requires PHP >= 8.4
        php-version:
          - "8.5"
        dependencies:
          - "highest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP with extensions"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          extensions: bcmath, bz2, gettext, mbstring, memcached, mysqli, opcache, pdo_mysql, zip, pdo, intl, json, pdo_pgsql, pgsql, session, simplexml, xml
          tools: composer:v2, pecl

      - name: "Set up problem matchers for PHP"
        run: "echo \"::add-matcher::${{ runner.tool_cache }}/php.json\""

      - name: "Install ${{ matrix.dependencies }} dependencies with composer"
        uses: "ramsey/composer-install@v3"
        with:
          dependency-versions: "${{ matrix.dependencies }}"

      - name: "Create cache directory for phpstan/phpstan"
        run: "mkdir -p .build/phpstan"

      - name: "Cache cache directory for phpstan/phpstan"
        uses: "actions/cache@v4"
        with:
          path: ".build/phpstan"
          key: "php-${{ matrix.php-version }}-phpstan-${{ github.sha }}"
          restore-keys: "php-${{ matrix.php-version }}-phpstan-"

      - name: "Run phpstan/phpstan"
        run: "vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=-1"
